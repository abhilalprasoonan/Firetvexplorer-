<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fire TV Explorer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #1e293b;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .path-bar {
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: monospace;
            margin-bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .card {
            background: #1e293b;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .card:focus, .card:hover {
            border-color: #38bdf8;
            background: #334155;
            outline: none;
            transform: scale(1.05);
        }
        .icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .name {
            font-size: 0.85rem;
            word-break: break-all;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🔥 Fire TV Explorer</h1>
    </header>

    <div class="path-bar" id="currentPath">/storage/emulated/0/</div>

    <div class="grid" id="fileList">
        <div class="card" tabindex="0">
            <div class="icon">📁</div>
            <div class="name">Download</div>
        </div>
        <div class="card" tabindex="0">
            <div class="icon">📁</div>
            <div class="name">Android</div>
        </div>
        <div class="card" tabindex="0">
            <div class="icon">🎬</div>
            <div class="name">Movies</div>
        </div>
        <div class="card" tabindex="0">
            <div class="icon">📦</div>
            <div class="name">app-release.apk</div>
        </div>
    </div>

</body>
</html>
